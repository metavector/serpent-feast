<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Serpent Feast</title>
<meta name="description" content="Eat people, grow into a colossal serpent, and conquer 20 levels in this arcade snake game.">
<script src="https://sdk.crazygames.com/crazygames-sdk-v3.js"></script>
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --edge:#2a1a3f;
  --sun:#ffd23f;
  --leaf:#5bd45b;
  --berry:#ff5a6e;
  --sky:#38c6d9;
  --grape:#8b5cf6;
  --panel:#fffaf0;
  --panel-ink:#2a1a3f;
  --bg:#7dd35c;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --panel:#3b2760; --panel-ink:#fff3d1; --bg:#2f6a27; }
}
:root[data-theme="dark"]{ --panel:#3b2760; --panel-ink:#fff3d1; --bg:#2f6a27; }
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none !important}
body{
  margin:0;height:100%;background:var(--bg);overflow:hidden;
  font-family:'Trebuchet MS','Segoe UI',system-ui,-apple-system,Roboto,sans-serif;
  touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;
}
#app{position:relative;width:100%;height:100%;overflow:hidden}
#game{position:absolute;inset:0;width:100%;height:100%;display:block}

#hud{position:absolute;inset:0;pointer-events:none;padding:10px 12px;display:grid;
  grid-template-columns:1fr auto 1fr;grid-template-areas:"l m r";gap:8px;align-items:start;align-content:start;grid-template-rows:auto}
.hud-left{grid-area:l;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.hud-mid{grid-area:m;justify-self:center;display:flex;flex-direction:column;gap:6px;align-items:center;min-width:min(64vw,290px)}
.hud-right{grid-area:r;justify-self:end;display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.pill{display:flex;align-items:center;gap:6px;background:rgba(255,250,240,.94);color:var(--edge);
  border:3px solid var(--edge);border-radius:999px;padding:2px 10px 2px 8px;box-shadow:0 3px 0 var(--edge);
  font-weight:800;font-size:15px;line-height:1.3;min-width:150px}
.pill .ico{font-size:16px}
.pill b{min-width:2.2ch;text-align:right}
.bar{flex:1;height:12px;border-radius:99px;background:#e6d9c0;border:2px solid var(--edge);overflow:hidden;min-width:56px}
.bar i{display:block;height:100%;width:100%;border-radius:99px;transition:width .12s linear}
#hpBar{background:var(--berry)} #stBar{background:var(--sun)} #grBar{background:var(--leaf)} #bossBar{background:var(--grape)}
.lvl{background:var(--edge);color:#fff4d6;font-weight:800;font-size:16px;padding:2px 16px 3px;border-radius:999px;
  box-shadow:0 3px 0 rgba(0,0,0,.25);white-space:nowrap}
.grow{min-width:min(64vw,290px)}
.score{background:rgba(255,250,240,.94);color:var(--edge);border:3px solid var(--edge);border-radius:16px;box-shadow:0 3px 0 var(--edge);
  padding:0 12px 1px;text-align:center;font-weight:800;line-height:1.1;min-width:92px}
.score small{display:block;font-size:12px;opacity:.75;padding-top:2px}
.score b{font-size:22px}
.btns{display:flex;gap:6px;pointer-events:auto}
.iconbtn{width:42px;height:42px;border-radius:50%;border:3px solid var(--edge);background:var(--sun);box-shadow:0 3px 0 var(--edge);
  font-size:18px;cursor:pointer;display:grid;place-items:center;padding:0;color:var(--edge)}
.iconbtn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--edge)}
.iconbtn.off{opacity:.5;filter:grayscale(.7)}
.iconbtn:focus-visible,.btn:focus-visible,#boostBtn:focus-visible{outline:3px solid var(--sky);outline-offset:3px}
#chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:flex;flex-direction:column;align-items:center;gap:1px;width:40px;padding:2px 3px 3px;border-radius:12px;
  background:rgba(255,250,240,.94);border:3px solid var(--edge);box-shadow:0 3px 0 var(--edge);font-size:17px;line-height:1.1}
.chip i{display:block;height:5px;width:100%;background:var(--sky);border-radius:9px;transition:width .1s linear}
#mini{position:absolute;left:12px;bottom:12px;width:104px;height:104px;border-radius:16px;border:3px solid var(--edge);
  box-shadow:0 3px 0 var(--edge);background:rgba(30,15,50,.35);opacity:.92}
#abil{position:absolute;right:12px;bottom:14px;display:flex;gap:6px;z-index:6}
.touch #abil{bottom:112px}
.ab{position:relative;overflow:hidden;width:46px;height:46px;border-radius:50%;border:3px solid var(--edge);background:var(--sun);color:var(--edge);
  font-size:20px;line-height:1;box-shadow:0 3px 0 var(--edge);cursor:pointer;display:grid;place-items:center;padding:0;touch-action:none}
.ab i{position:absolute;left:0;right:0;bottom:0;height:0;background:rgba(42,26,63,.55);pointer-events:none}
.ab b{position:absolute;right:3px;top:0;font-size:10px;font-weight:800}
.touch .ab b{display:none}
.ab.rdy{animation:rdy 1.8s ease-in-out infinite}
@keyframes rdy{0%,100%{box-shadow:0 3px 0 var(--edge)}50%{box-shadow:0 3px 0 var(--edge),0 0 0 4px rgba(255,210,63,.55)}}
.btn.ghost{background:transparent;color:var(--panel-ink);box-shadow:none;border-color:var(--panel-ink);font-size:17px;padding:4px 18px 6px;opacity:.9}
.menu-grid{display:grid;grid-template-columns:1fr 1fr;gap:2px 8px;margin-top:6px}
.menu-grid .btn{font-size:17px;padding:6px 8px 8px;margin:4px 0 6px}
.lgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin:10px 0 14px}
.lv{position:relative;font-family:inherit;border:3px solid var(--edge);border-radius:14px;background:var(--sun);color:var(--edge);
  box-shadow:0 4px 0 var(--edge);padding:4px 0 5px;cursor:pointer;font-weight:800}
.lv b{display:block;font-size:22px;line-height:1.1}
.lv span{display:block;font-size:13px;letter-spacing:1px;color:#b86e00}
.lv i{position:absolute;top:-9px;right:-7px;font-style:normal;font-size:16px}
.lv.lock{background:#cfc6dd;color:#7d7590;box-shadow:0 2px 0 var(--edge);cursor:not-allowed}
.lv:active:not(.lock){transform:translateY(3px);box-shadow:0 1px 0 var(--edge)}
.cards{display:grid;gap:10px;margin:12px 0 4px}
.card{font-family:inherit;text-align:left;display:grid;grid-template-columns:52px 1fr;column-gap:10px;align-items:center;border:4px solid var(--edge);
  border-radius:18px;background:#fff;color:var(--edge);box-shadow:0 5px 0 var(--edge);padding:8px 12px 9px;cursor:pointer}
.card em{grid-row:1/4;font-style:normal;font-size:38px;text-align:center}
.card b{font-size:19px;line-height:1.2}
.card span{font-size:14px;font-weight:600;line-height:1.3;opacity:.85}
.card small{font-size:12px;font-weight:800;color:#c2185b}
.card:active{transform:translateY(3px);box-shadow:0 2px 0 var(--edge)}
.stars{font-size:40px;line-height:1.1;color:var(--sun);-webkit-text-stroke:2px var(--edge);paint-order:stroke fill;letter-spacing:4px}
.hint{font-size:13px;font-weight:600;opacity:.85;margin:2px 0 8px;line-height:1.4}
.tgs{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:6px 0 10px}
.tg{font-family:inherit;font-weight:800;font-size:14px;padding:3px 12px 5px;border:3px solid var(--edge);border-radius:999px;background:var(--sky);
  color:var(--edge);box-shadow:0 3px 0 var(--edge);cursor:pointer}
.tg.off{background:#cfc6dd;opacity:.75}
.skins,.bgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0 12px}
.sk{font-family:inherit;border:3px solid var(--edge);border-radius:16px;background:#fff;color:var(--edge);box-shadow:0 4px 0 var(--edge);
  padding:6px 6px 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.sk i{display:block;width:100%;height:22px;border-radius:99px;border:3px solid var(--edge)}
.sk b{font-size:16px}
.sk span{font-size:12px;font-weight:700}
.sk.sel{background:#fff3b0;outline:3px solid var(--leaf)}
.sk.lock{background:#e6e0ef;opacity:.75;cursor:not-allowed}
.bdg{border:3px solid var(--edge);border-radius:16px;padding:6px 6px 8px;background:#e6e0ef;color:#6d6482;display:flex;flex-direction:column;
  align-items:center;gap:1px;text-align:center}
.bdg em{font-style:normal;font-size:28px}
.bdg b{font-size:15px}
.bdg span{font-size:12px;font-weight:600;line-height:1.25}
.bdg.got{background:#fff3b0;color:var(--edge)}
/* Tutorial overlay styling */
.tutorial-panel{width:min(96vw,540px)}
.tut-grid{display:flex;flex-direction:column;gap:10px;margin:14px 0 18px;text-align:left}
.tut-row{display:grid;grid-template-columns:64px 1fr;gap:12px;align-items:center;background:rgba(42,26,63,.07);border:2px solid var(--edge);
  border-radius:16px;padding:8px 12px}
.tut-row em{font-style:normal;font-size:32px;text-align:center;line-height:1;flex:none}
.tut-row b{display:block;font-size:17px;font-weight:800;line-height:1.2}
.tut-row span{display:block;font-size:14px;font-weight:600;line-height:1.35;opacity:.85;margin-top:2px}
.tut-row kbd{display:inline-block;background:var(--edge);color:#fff4d6;font-family:inherit;font-weight:800;
  font-size:12px;padding:1px 7px 2px;border-radius:6px;margin:0 2px;box-shadow:0 2px 0 rgba(0,0,0,.25)}
@media (max-width:640px){
  #hud{grid-template-columns:1fr auto;grid-template-areas:"m m" "l r";padding:8px 10px;gap:7px 8px}
  .hud-mid{width:100%;min-width:0;flex-direction:row;flex-wrap:wrap;justify-content:center;align-items:center;gap:6px}
  .lvl{flex:none;max-width:50%;overflow:hidden;text-overflow:ellipsis;font-size:13px;padding:1px 12px 2px}
  .grow{flex:1 1 0;min-width:0}
  #bossPill{flex:1 1 100%}
  .pill{min-width:0;font-size:13px;padding:1px 8px 1px 6px;gap:5px;box-shadow:0 2px 0 var(--edge)}
  .pill .ico{font-size:14px}
  .bar{height:11px;min-width:40px}
  .hud-left{gap:5px}
  .hud-left .pill{width:min(44vw,168px)}
  .hud-right{gap:5px}
  .score{display:flex;align-items:baseline;gap:6px;min-width:0;padding:0 10px 1px;border-radius:14px;box-shadow:0 2px 0 var(--edge)}
  .score small{display:inline;padding:0;font-size:12px}
  .score b{font-size:18px}
  .btns{gap:5px}
  .iconbtn{width:36px;height:36px;font-size:16px;box-shadow:0 2px 0 var(--edge)}
  .chip{width:34px;font-size:15px;box-shadow:0 2px 0 var(--edge)}
  #mini{width:84px;height:84px;left:10px;bottom:12px}
  #boostBtn{width:84px;height:84px;right:12px;bottom:14px;font-size:17px}
  #boostBtn span{font-size:24px}
  .tut-row{grid-template-columns:48px 1fr;padding:6px 10px}
  .tut-row em{font-size:24px}
  .tut-row b{font-size:15px}
  .tut-row span{font-size:12px}
}
@media (max-height:480px){
  #hud{padding:6px 10px}
  #mini{width:74px;height:74px}
  #boostBtn{width:70px;height:70px;font-size:15px}
  #boostBtn span{font-size:20px}
  .iconbtn{width:34px;height:34px}
  .touch #abil{bottom:94px}
}
#toast{position:absolute;top:28%;left:50%;transform:translateX(-50%);z-index:12;pointer-events:none;
  background:var(--sun);color:var(--edge);font-weight:800;font-size:clamp(20px,5vw,30px);padding:4px 22px 6px;
  border:4px solid var(--edge);border-radius:999px;box-shadow:0 6px 0 var(--edge);animation:toast 2.2s ease forwards;white-space:nowrap}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-20px) scale(.7)}10%{opacity:1;transform:translate(-50%,0) scale(1.05)}
  16%{transform:translate(-50%,0) scale(1)}85%{opacity:1}100%{opacity:0;transform:translate(-50%,-10px)}}
#banner{position:absolute;left:50%;top:26%;transform:translateX(-50%);z-index:11;pointer-events:none;text-align:center;
  animation:banner 3s ease forwards;width:min(92vw,520px)}
#banner .n{display:inline-block;background:var(--edge);color:#fff4d6;font-weight:800;font-size:clamp(18px,4.6vw,26px);
  padding:0 20px 2px;border-radius:999px}
#banner .t{display:block;font-weight:800;font-size:clamp(42px,11vw,76px);line-height:1.15;color:var(--sun);
  -webkit-text-stroke:9px var(--edge);paint-order:stroke fill;text-shadow:0 6px 0 var(--edge)}
#banner .g{display:inline-block;background:var(--panel);color:var(--panel-ink);font-weight:700;font-size:clamp(15px,3.8vw,20px);
  border:3px solid var(--edge);border-radius:14px;padding:2px 14px 4px;box-shadow:0 4px 0 var(--edge);margin-top:6px}
@keyframes banner{0%{opacity:0;transform:translate(-50%,-30px) scale(.8)}12%{opacity:1;transform:translate(-50%,0) scale(1.04)}
  18%{transform:translate(-50%,0) scale(1)}82%{opacity:1}100%{opacity:0;transform:translate(-50%,-14px)}}
#boostBtn{position:absolute;right:16px;bottom:16px;width:92px;height:92px;border-radius:50%;z-index:6;
  border:4px solid var(--edge);background:var(--sun);color:var(--edge);font:800 20px/1 inherit;font-family:inherit;
  box-shadow:0 6px 0 var(--edge);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;touch-action:none;cursor:pointer}
#boostBtn span{font-size:28px;line-height:1}
#boostBtn.on{transform:translateY(4px);box-shadow:0 2px 0 var(--edge);background:#ffb703}
#overlay{position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:14px;
  background:rgba(38,20,60,.42);backdrop-filter:blur(2px);overflow:auto}
.panel{background:var(--panel);color:var(--panel-ink);border:4px solid var(--edge);border-radius:28px;box-shadow:0 8px 0 var(--edge);
  padding:20px 22px 24px;width:min(94vw,470px);text-align:center;animation:pop .38s cubic-bezier(.2,1.5,.4,1);max-height:96%;overflow:auto}
@keyframes pop{0%{opacity:0;transform:scale(.8) translateY(20px)}100%{opacity:1;transform:none}}
.title{margin:0;font-weight:800;font-size:clamp(46px,13vw,74px);line-height:1.1;color:var(--sun);
  -webkit-text-stroke:10px var(--edge);paint-order:stroke fill;text-shadow:0 7px 0 var(--edge);padding:0 4px;letter-spacing:1px}
.h2{margin:0 0 4px;font-weight:800;font-size:clamp(30px,8vw,40px);line-height:1.2}
.sub{margin:8px 0 14px;font-weight:600;font-size:18px;line-height:1.35}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0 16px}
.stat{background:rgba(42,26,63,.09);border-radius:16px;padding:4px 8px 6px;font-weight:700;font-size:14px}
.stat b{display:block;font-size:24px;line-height:1.15}
.btn{font-family:inherit;font-weight:800;font-size:22px;line-height:1.2;padding:7px 26px 9px;border-radius:999px;border:4px solid var(--edge);
  background:var(--sun);color:var(--edge);box-shadow:0 6px 0 var(--edge);cursor:pointer;margin:4px 4px 8px;transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--edge)}
.btn.alt{background:var(--sky)}
.btn.big{font-size:28px;padding:9px 34px 11px}
.legend{display:grid;grid-template-columns:1fr;gap:5px;margin:12px 0 4px;text-align:left}
.legend div{display:flex;gap:10px;align-items:center;background:rgba(42,26,63,.08);border-radius:14px;padding:2px 10px 3px;font-weight:600;font-size:15px;line-height:1.3}
.legend em{font-style:normal;font-size:22px;width:1.5em;text-align:center;flex:none}
.legend b{font-weight:800}
.how{font-weight:600;font-size:15px;line-height:1.5;margin:10px 0 0;opacity:.9}
.best{font-weight:800;font-size:17px;margin:2px 0 8px}
.credit{margin:2px 0 10px;font-weight:700;font-size:14px;opacity:.75;line-height:1.4}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}
}
</style>
</head>
<body>
<div id="app">
  <canvas id="game"></canvas>

  <div id="hud" hidden>
    <div class="hud-left">
      <div class="pill"><span class="ico">❤️</span><div class="bar"><i id="hpBar"></i></div><b id="hpTxt">100</b></div>
      <div class="pill"><span class="ico">⚡</span><div class="bar"><i id="stBar"></i></div></div>
      <div id="chips">
        <div class="chip" data-k="speed" hidden>💨<i></i></div>
        <div class="chip" data-k="shield" hidden>🛡️<i></i></div>
        <div class="chip" data-k="magnet" hidden>🧲<i></i></div>
      </div>
    </div>
    <div class="hud-mid">
      <div class="lvl" id="lvlName">Level 1: Village</div>
      <div class="pill grow"><span class="ico">🐍</span><div class="bar"><i id="grBar"></i></div><b id="grTxt">0/10</b></div>
      <div class="pill grow" id="bossPill" hidden><span class="ico">👹</span><div class="bar"><i id="bossBar"></i></div></div>
    </div>
    <div class="hud-right">
      <div class="score"><small>Score</small><b id="scoreTxt">0</b></div>
      <div class="btns">
        <button class="iconbtn" id="bloodBtn" aria-label="Toggle blood effects" aria-pressed="false">🩸</button>
        <button class="iconbtn" id="muteBtn" aria-label="Toggle sound">🔊</button>
        <button class="iconbtn" id="pauseBtn" aria-label="Pause">⏸️</button>
      </div>
    </div>
    <canvas id="mini" width="104" height="104"></canvas>
  </div>

  <div id="banner" hidden></div>
  <button id="boostBtn" hidden aria-label="Boost"><span>🚀</span>Boost</button>
  <div id="abil" hidden>
    <button class="ab" data-i="0" aria-label="Poison Breath">☠️<b>Q</b><i></i></button>
    <button class="ab" data-i="1" aria-label="Tail Whip">💥<b>E</b><i></i></button>
    <button class="ab" data-i="2" aria-label="Coil Trap">🌪️<b>R</b><i></i></button>
  </div>
  <div id="overlay" hidden></div>
</div>

<script>
(() => {
'use strict';

/* =====================================================================
   CrazyGames SDK v3 wrapper — safe, silently falls back if unavailable
===================================================================== */
const CG = {
  sdk: null, ready: false, muted: false, init() {
    try {
      const s = window.CrazyGames && window.CrazyGames.SDK;
      if (s) { this.sdk = s; this.ready = true; }
    } catch (e) { this.ready = false; }
    try {
      if (this.ready && this.sdk.game && this.sdk.game.loadingStart) this.sdk.game.loadingStart();
    } catch (e) {}
  },
  loadingStop() { try { if (this.ready && this.sdk.game && this.sdk.game.loadingStop) this.sdk.game.loadingStop(); } catch (e) {} },
  gameplayStart() { try { if (this.ready && this.sdk.game && this.sdk.game.gameplayStart) this.sdk.game.gameplayStart(); } catch (e) {} },
  gameplayStop() { try { if (this.ready && this.sdk.game && this.sdk.game.gameplayStop) this.sdk.game.gameplayStop(); } catch (e) {} },
  happyTime() { try { if (this.ready && this.sdk.game && this.sdk.game.happytime) this.sdk.game.happytime(); } catch (e) {} },
  isMuted() { try { return this.ready && this.sdk.game && this.sdk.game.isMuted ? !!this.sdk.game.isMuted() : false; } catch (e) { return false; } }
};
CG.init();

/* =====================================================================
   Helpers
===================================================================== */
const INK = '#2a1a3f', TAU = Math.PI * 2;
const $ = s => document.querySelector(s);
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const pick = a => a[Math.floor(Math.random() * a.length)];
const angDiff = (a, b) => { let d = (b - a) % TAU; if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU; return d; };
const bn = n => String(Math.round(n));
const reduceMotion = (() => { try { return matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { return false; } })();
const isTouch = (() => { try { return matchMedia('(pointer: coarse)').matches; } catch (e) { return false; } })();
const FONT = 'system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif';

const app = $('#app'), canvas = $('#game'), ctx = canvas.getContext('2d');
const mini = $('#mini'), mctx = mini.getContext('2d');
const ov = $('#overlay'), hud = $('#hud'), bannerEl = $('#banner'), boostBtn = $('#boostBtn');
const el = {
  hpBar: $('#hpBar'), hpTxt: $('#hpTxt'), stBar: $('#stBar'), grBar: $('#grBar'), grTxt: $('#grTxt'),
  lvlName: $('#lvlName'), score: $('#scoreTxt'), bossPill: $('#bossPill'), bossBar: $('#bossBar'),
  mute: $('#muteBtn'), pause: $('#pauseBtn'), blood: $('#bloodBtn')
};
const chips = {};
document.querySelectorAll('#chips .chip').forEach(c => chips[c.dataset.k] = { root: c, bar: c.querySelector('i') });
const abilEl = $('#abil');
const abBtn = [];
document.querySelectorAll('#abil .ab').forEach(b => abBtn.push({ root: b, fill: b.querySelector('i') }));

/* =====================================================================
   Levels & themes

function worldToScreen(x, y) { return { x: (x - cam.x) * view.zoom + cw / 2, y: (y - cam.y) * view.zoom + ch / 2 }; }

function updateSnake(dt) {

      for (let j = 0; j < s.segs.length; j += 2) {
        const sg = s.segs[j];
        if (Math.abs(sg.x - p.x) < tr && Math.abs(sg.y - p.y) < tr && Math.hypot(sg.x - p.x, sg.y - p.y) < tr) {
          hurt(p.dmg, 'Arrow!'); dead = true; burst(p.x, p.y, 4, ['#fff', '#ffd23f']); break;
        }
      }
    }
    if (dead) G.projectiles.splice(i, 1);
  }
  for (let i = G.nets.length - 1; i >= 0; i--) {
    const n = G.nets[i];
    if (!n.zone) { n.t += dt; if (n.t >= n.dur) { n.zone = true; puff(n.tx, n.ty, '#e6e6ff'); puff(n.tx, n.ty, '#e6e6ff'); } }

  }
}
function updateFX(dt) {
  G.shake = Math.max(0, G.shake - dt * 30); G.flash = Math.max(0, G.flash - dt);
  for (let i = G.parts.length - 1; i >= 0; i--) {
    const p = G.parts[i]; p.life -= dt;
    if (p.life <= 0) {
      if (p.k === 'blood' && G.blood && G.stains.length < 70 && Math.random() < 0.55) G.stains.push({ x: p.x, y: p.y, life: 10, b: [{ dx: 0, dy: 0, r: p.size * 0.9 }] });
      G.parts.splice(i, 1); continue;
    }
    p.x += p.vx * dt; p.y += p.vy * dt;
    if (p.k === 'star') { p.vx *= 0.95; p.vy *= 0.95; p.rot += p.vr * dt; }
    else if (p.k === 'conf') { p.vy += 380 * dt; p.vx *= 0.99; p.rot += p.vr * dt; }
    else if (p.k === 'blood') { p.vy += 560 * dt; p.vx *= 0.985; }
    else if (p.k === 'heart') { p.vx = Math.sin(G.time * 4 + p.rot) * 24; }
    else if (p.k === 'note') { p.vx = Math.sin(G.time * 5 + p.rot) * 30; }
  }
  for (let i = G.stains.length - 1; i >= 0; i--) { G.stains[i].life -= dt; if (G.stains[i].life <= 0) G.stains.splice(i, 1); }
  for (let i = G.texts.length - 1; i >= 0; i--) {
    const t = G.texts[i]; t.life -= dt * 0.85; t.y += t.vy * dt; t.vy *= 0.96;
    if (t.life <= 0) G.texts.splice(i, 1);
  }
}

function manage(dt) {
  const L = LEVELS[G.level - 1];
  G.spawnT -= dt;
  if (G.spawnT <= 0) {
    G.spawnT = 0.45;
    let alive = 0;
    for (const h of G.humans) if (h.type !== 'boss' && !h.minion && h.eaten === 0) alive++;
    if (alive < (G.endless ? Math.min(46, 26 + Math.floor(G.eTime / 20)) : L.count)) {
      const type = pickType(L.mix), p = freeSpot(18, 380);
      spawnHuman(type, p.x, p.y);
    }
  }
  G.puT -= dt;
  if (G.puT <= 0) {
    G.puT = 8;
    if (G.powerups.length < 3) {
      const p = freeSpot(20, 200);
      const r = Math.random(), type = r < 0.14 ? 'love' : r < 0.4 ? 'heal' : r < 0.64 ? 'speed' : r < 0.84 ? 'shield' : 'magnet';
      G.powerups.push({ type, x: p.x, y: p.y, ph: rand(0, 6) });
    }
  }
  G.comboT = Math.max(0, G.comboT - dt);
  if (G.comboT === 0) G.combo = 0;
}

      showOverlay(`<div class="panel"><h2 class="h2">Start a New Game?</h2><p class="sub">Starting fresh will erase your progress (Level ${bn(SV.unlocked)}).<br>Stars, badges and skins will remain.</p><button class="btn big" data-a="newok">Yes, start fresh</button><br><button class="btn alt" data-a="menu">No, go back</button></div>`);
    } else actions.newok();
  },
  newok() {
    SV.unlocked = 1; SV.total = 0; SV.score = 0; SV.hp = 100; SV.up = defaultUp(); SV.snap = defaultSave().snap; saveNow();
    UP = defaultUp(); snake.total = 0; snake.hp = 100; G.score = 0;
    // First-time tutorial before the very first level
    if (!tutorialSeen) { showTutorial(); return; }
    runLevel(1, false);
  },
  tutok() {
    try { localStorage.setItem('serpent-feast-tutorial-seen', '1'); } catch (e) {}
    tutorialSeen = true;
    runLevel(1, false);
  },
  continue() {
    UP = { ...SV.up }; snake.total = SV.total; snake.hp = Math.max(30, SV.hp || 100); G.score = SV.score;
    runLevel(Math.min(20, SV.unlocked), false);
  },
  levels: showLevels, skins: showSkins, badges: showBadges, help: showHelp,
  play(v) {
    const n = +v; if (n > SV.unlocked) return;
    const sn = SV.snap[n] || { total: n * 8, score: 0, up: defaultUp(), hp: 100 };
    UP = { ...defaultUp(), ...sn.up }; snake.total = sn.total; snake.hp = sn.hp || 100; G.score = sn.score || 0;
    runLevel(n, n < SV.unlocked);
  },
  skin(v) { SV.skin = +v; saveNow(); showSkins(); },
  endless() {
    if (!SV.endlessOpen) { showOverlay(`<div class="panel"><h2 class="h2">🔒 Endless Mode</h2><p class="sub">Clear all 20 levels to unlock Endless Mode.</p><button class="btn big" data-a="menu">Back</button></div>`); return; }
    startEndless();
  },
  next() { showUpgrade(); },
  up(v) { if (UP[v] !== undefined) UP[v]++; proceedNext(); },
  retry() {
    if (G.endless) { startEndless(); return; }
    snake.total = G.startTotal; G.score = G.startScore; UP = { ...G.startUp }; snake.hp = 9999;
    G.state = 'playing'; closeOverlay(); setHud(true);
    CG.gameplayStart();
    startLevel(G.level);
  },
  tg(v) {
    if (v === 'blood') toggleBlood();
    else if (v === 'sound') toggleMute();
    else if (v === 'music') { G.musicOn = !G.musicOn; savePref('serpent-feast-music', G.musicOn); }
    else if (v === 'vib') { G.vibOn = !G.vibOn; savePref('serpent-feast-vib', G.vibOn); if (G.vibOn) vib(30); }
    showPause();
  },
  menu: showMenu,
  resume() { closeOverlay(); G.state = 'playing'; CG.gameplayStart(); last = performance.now(); }
};
function pauseGame() { if (G.state === 'playing') { G.state = 'paused'; input.mouse.down = false; input.boostBtn = false; boostBtn.classList.remove('on'); saveNow(); CG.gameplayStop(); showPause(); } }
function togglePause() { if (G.state === 'playing') pauseGame(); else if (G.state === 'paused') actions.resume(); }

addEventListener('keydown', e => {
  input.keys.add(e.code);
  if (e.code === 'Space' || e.code.startsWith('Arrow')) e.preventDefault();
  if (e.code === 'Escape' || e.code === 'KeyP') togglePause();
  const ai = ['KeyQ', 'KeyE', 'KeyR'].indexOf(e.code);
  if (ai >= 0 && !e.repeat) useAbility(ai);
  initAudio();
});
addEventListener('keyup', e => input.keys.delete(e.code));
addEventListener('blur', () => { input.keys.clear(); input.mouse.down = false; pauseGame(); });
document.addEventListener('visibilitychange', () => { if (document.hidden) pauseGame(); });

function localXY(e) { const r = canvas.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
canvas.addEventListener('pointerdown', e => {
  initAudio(); const p = localXY(e);
  if (e.pointerType === 'mouse') { input.mouse.on = true; input.mouse.x = p.x; input.mouse.y = p.y; if (e.button === 0) input.mouse.down = true; }
  else if (!input.joy) { input.joy = { id: e.pointerId, ox: p.x, oy: p.y, x: p.x, y: p.y }; try { canvas.setPointerCapture(e.pointerId); } catch (er) {} }
});
canvas.addEventListener('pointermove', e => {
  const p = localXY(e);
  if (e.pointerType === 'mouse') { input.mouse.on = true; input.mouse.x = p.x; input.mouse.y = p.y; }
  else if (input.joy && input.joy.id === e.pointerId) { input.joy.x = p.x; input.joy.y = p.y; }
});
const endPtr = e => {
  if (e.pointerType === 'mouse') input.mouse.down = false;
  else if (input.joy && input.joy.id === e.pointerId) input.joy = null;
};
canvas.addEventListener('pointerup', endPtr);
canvas.addEventListener('pointercancel', endPtr);
addEventListener('pointerup', e => { if (e.pointerType === 'mouse') input.mouse.down = false; });
canvas.addEventListener('contextmenu', e => e.preventDefault());

const boostOff = () => { input.boostBtn = false; boostBtn.classList.remove('on'); };
boostBtn.addEventListener('pointerup', boostOff);

/* =====================================================================
   Drawing helpers
===================================================================== */
function rr(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y); ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r); ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h); ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r); ctx.quadraticCurveTo(x, y, x + r, y); ctx.closePath();
}
function blobPath(r, j) {
  const n = j.length, pts = [];
  for (let i = 0; i < n; i++) { const a = i / n * TAU; pts.push([Math.cos(a) * r * j[i], Math.sin(a) * r * j[i]]); }
  ctx.beginPath();
  ctx.moveTo((pts[0][0] + pts[1][0]) / 2, (pts[0][1] + pts[1][1]) / 2);
  for (let i = 1; i <= n; i++) {
    const p = pts[i % n], q = pts[(i + 1) % n];
    ctx.quadraticCurveTo(p[0], p[1], (p[0] + q[0]) / 2, (p[1] + q[1]) / 2);
  }
  ctx.closePath();
}
function starPath(x, y, r1, r2, n, rot) {
  ctx.beginPath();
  for (let i = 0; i < n * 2; i++) {
    const r = i % 2 ? r2 : r1, a = rot + i * Math.PI / n;
    ctx[i ? 'lineTo' : 'moveTo'](x + Math.cos(a) * r, y + Math.sin(a) * r);
  }
  ctx.closePath();
}
function blob(x, y, rx, ry, fill) {
  ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, TAU);
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  ctx.stroke();
}
const vis = (x, y, r) => x > view.x0 - r && x < view.x1 + r && y > view.y0 - r && y < view.y1 + r;

/* =====================================================================
   Obstacles drawing
===================================================================== */
function drawPond(o) {
  ctx.save(); ctx.translate(o.x, o.y);
  ctx.strokeStyle = INK; ctx.lineWidth = 3.5; ctx.lineJoin = 'round';
  blobPath(o.r * 1.1, o.j); ctx.fillStyle = G.theme.shore; ctx.fill(); ctx.stroke();
  blobPath(o.r * 0.96, o.j); ctx.fillStyle = G.theme.water || '#48b9f0'; ctx.fill();
  ctx.lineWidth = 2; ctx.strokeStyle = 'rgba(255,255,255,.55)';
  for (let i = 0; i < 3; i++) {
    const k = ((G.time * 0.25 + i / 3) % 1);
    ctx.globalAlpha = 1 - k; ctx.beginPath(); ctx.ellipse(-o.r * 0.15, -o.r * 0.1, o.r * (0.2 + k * 0.5), o.r * (0.14 + k * 0.34), 0, 0, TAU); ctx.stroke();
  }
  ctx.globalAlpha = 1;
  if (o.pads) for (let i = 0; i < 3; i++) {
    const a = o.pads[i], px = Math.cos(a) * o.r * 0.5, py = Math.sin(a) * o.r * 0.5;
    ctx.fillStyle = '#4fbf57'; ctx.strokeStyle = INK; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(px, py); ctx.arc(px, py, 10, a + 0.4, a + TAU - 0.4); ctx.closePath(); ctx.fill(); ctx.stroke();
  }
  ctx.restore();
}
function drawThorn(o) {
  ctx.save(); ctx.translate(o.x, o.y);
  ctx.fillStyle = 'rgba(20,10,40,.2)'; ctx.beginPath(); ctx.ellipse(4, 6, o.r * 1.05, o.r * 0.9, 0, 0, TAU); ctx.fill();
  ctx.strokeStyle = INK; ctx.lineWidth = 3; ctx.lineJoin = 'round';
  ctx.beginPath();
  const n = o.j.length;
  for (let i = 0; i < n * 2; i++) {
    const r = (i % 2 ? o.r * 0.68 : o.r * 1.12) * o.j[(i >> 1) % n], a = i * Math.PI / n;
    ctx[i ? 'lineTo' : 'moveTo'](Math.cos(a) * r, Math.sin(a) * r);
  }
  ctx.closePath(); ctx.fillStyle = '#3b8f43'; ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#2d7536'; ctx.beginPath(); ctx.arc(0, 0, o.r * 0.55, 0, TAU); ctx.fill();
  ctx.fillStyle = '#ff5a6e';
  for (let i = 0; i < 4; i++) { const a = i * 1.57 + o.ph; ctx.beginPath(); ctx.arc(Math.cos(a) * o.r * 0.32, Math.sin(a) * o.r * 0.32, 3.2, 0, TAU); ctx.fill(); }
  ctx.restore();
}
function drawFire(o) {
  ctx.save(); ctx.translate(o.x, o.y);
  const t = G.time * 8 + o.ph;
  ctx.fillStyle = 'rgba(255,170,60,.22)'; ctx.beginPath(); ctx.arc(0, 0, o.r * 2.3, 0, TAU); ctx.fill();
  ctx.strokeStyle = INK; ctx.lineWidth = 3; ctx.lineJoin = 'round';
  ctx.fillStyle = '#7a4a26';
  for (let i = 0; i < 3; i++) { ctx.save(); ctx.rotate(i * 1.05 + 0.3); rr(-o.r * 1.1, -4, o.r * 2.2, 8, 4); ctx.fill(); ctx.stroke(); ctx.restore(); }
  const flame = (sc, col, ph) => {
    const h = o.r * 1.7 * sc + Math.sin(t + ph) * 3, w = o.r * 0.95 * sc;
    ctx.beginPath(); ctx.moveTo(-w, 2);
    ctx.quadraticCurveTo(-w * 1.1, -h * 0.5, Math.sin(t * 0.7 + ph) * 4, -h);
    ctx.quadraticCurveTo(w * 1.1, -h * 0.5, w, 2);
    ctx.quadraticCurveTo(0, w * 0.9, -w, 2); ctx.closePath(); ctx.fillStyle = col; ctx.fill();
  };
  flame(1, '#ff6b35', 0); ctx.stroke(); flame(0.7, '#ffb703', 1.5); flame(0.4, '#fff3b0', 3);
  ctx.restore();
}
function drawFence(o) {
  ctx.save(); ctx.strokeStyle = INK; ctx.lineWidth = 3; ctx.lineJoin = 'round';
  ctx.fillStyle = 'rgba(20,10,40,.18)'; rr(o.x + 4, o.y + 6, o.w, o.h, 5); ctx.fill();
  rr(o.x, o.y, o.w, o.h, 5); ctx.fillStyle = '#c48a52'; ctx.fill(); ctx.stroke();
  ctx.strokeStyle = 'rgba(90,50,20,.55)'; ctx.lineWidth = 2; ctx.beginPath();
  if (o.w > o.h) { ctx.moveTo(o.x + 4, o.y + o.h / 2); ctx.lineTo(o.x + o.w - 4, o.y + o.h / 2); }
  else { ctx.moveTo(o.x + o.w / 2, o.y + 4); ctx.lineTo(o.x + o.w / 2, o.y + o.h - 4); }
  ctx.stroke();
  ctx.strokeStyle = INK; ctx.lineWidth = 2.5; ctx.fillStyle = '#e0aa6e';
  const horiz = o.w > o.h, len = horiz ? o.w : o.h, n = Math.max(2, Math.round(len / 44));
  for (let i = 0; i <= n; i++) {
    const px = horiz ? o.x + len * i / n : o.x + o.w / 2, py = horiz ? o.y + o.h / 2 : o.y + len * i / n;
    ctx.beginPath(); ctx.arc(px, py, 7.5, 0, TAU); ctx.fill(); ctx.stroke();
  }
  ctx.restore();
}
function drawHouse(o) {
  const st = G.theme.house, [c1, c2] = o.c;
  ctx.save(); ctx.strokeStyle = INK; ctx.lineWidth = 3.5; ctx.lineJoin = 'round';
  ctx.fillStyle = 'rgba(20,10,40,.2)'; rr(o.x + 7, o.y + 9, o.w, o.h, 8); ctx.fill();
  if (st === 'hut') {
    rr(o.x, o.y, o.w, o.h, 10); ctx.fillStyle = c1; ctx.fill(); ctx.stroke();
    ctx.fillStyle = c2; rr(o.x + 6, o.y + 6, o.w - 12, o.h / 2 - 6, 6); ctx.fill();
    ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(o.x + 6, o.y + o.h / 2); ctx.lineTo(o.x + o.w - 6, o.y + o.h / 2); ctx.stroke();
    ctx.lineWidth = 1.6; ctx.strokeStyle = 'rgba(42,26,63,.35)'; ctx.beginPath();
    for (let x = o.x + 14; x < o.x + o.w - 8; x += 14) { ctx.moveTo(x, o.y + 8); ctx.lineTo(x, o.y + o.h - 8); }
    ctx.stroke();
    ctx.strokeStyle = INK; ctx.lineWidth = 3; ctx.fillStyle = '#b5b0a8'; rr(o.x + o.w - 30, o.y + 12, 16, 16, 3); ctx.fill(); ctx.stroke();
  } else if (st === 'building') {
    rr(o.x, o.y, o.w, o.h, 8); ctx.fillStyle = c1; ctx.fill(); ctx.stroke();
    ctx.fillStyle = c2; rr(o.x + 8, o.y + 8, o.w - 16, o.h - 16, 5); ctx.fill();
    ctx.lineWidth = 2.5; ctx.stroke();
    ctx.fillStyle = '#e8eef5'; rr(o.x + 16, o.y + 16, 26, 20, 4); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#9fb0c4'; rr(o.x + o.w - 40, o.y + o.h - 34, 24, 22, 4); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#7fd6ff'; rr(o.x + o.w - 40, o.y + 16, 24, 24, 12); ctx.fill(); ctx.stroke();
  } else if (st === 'stall') {
    rr(o.x, o.y, o.w, o.h, 8); ctx.fillStyle = '#fff'; ctx.fill();
    ctx.save(); rr(o.x, o.y, o.w, o.h, 8); ctx.clip();
    ctx.fillStyle = c1; for (let x = o.x, i = 0; x < o.x + o.w; x += 16, i++) if (i % 2 === 0) ctx.fillRect(x, o.y, 16, o.h);
    ctx.restore(); rr(o.x, o.y, o.w, o.h, 8); ctx.stroke();
    ctx.fillStyle = '#ffd23f'; ctx.beginPath(); ctx.arc(o.x + o.w / 2, o.y + o.h / 2, 12, 0, TAU); ctx.fill(); ctx.stroke();
  } else {
    rr(o.x, o.y, o.w, o.h, 6); ctx.fillStyle = c1; ctx.fill(); ctx.stroke();
    ctx.fillStyle = c2; rr(o.x + 12, o.y + 12, o.w - 24, o.h - 24, 4); ctx.fill(); ctx.lineWidth = 2.5; ctx.stroke();
    ctx.fillStyle = c1; ctx.lineWidth = 2.5;
    for (let x = o.x + 4; x < o.x + o.w - 10; x += 22) { rr(x, o.y - 5, 12, 12, 2); ctx.fill(); ctx.stroke(); rr(x, o.y + o.h - 7, 12, 12, 2); ctx.fill(); ctx.stroke(); }
    for (let y = o.y + 4; y < o.y + o.h - 10; y += 22) { rr(o.x - 5, y, 12, 12, 2); ctx.fill(); ctx.stroke(); rr(o.x + o.w - 7, y, 12, 12, 2); ctx.fill(); ctx.stroke(); }
    ctx.fillStyle = '#ff5a6e'; ctx.beginPath(); ctx.moveTo(o.x + o.w / 2, o.y + 18); ctx.lineTo(o.x + o.w / 2 + 18, o.y + 26); ctx.lineTo(o.x + o.w / 2, o.y + 34); ctx.closePath(); ctx.fill(); ctx.stroke();
  }
  ctx.restore();
}
function drawRock(o) {
  ctx.save(); ctx.translate(o.x, o.y);
  ctx.fillStyle = 'rgba(20,10,40,.2)'; ctx.beginPath(); ctx.ellipse(5, 7, o.r * 1.05, o.r * 0.85, 0, 0, TAU); ctx.fill();
  ctx.strokeStyle = INK; ctx.lineWidth = 3.5; ctx.lineJoin = 'round';
  blobPath(o.r, o.j); ctx.fillStyle = G.theme.rock[0]; ctx.fill(); ctx.stroke();
  ctx.save(); ctx.translate(-o.r * 0.18, -o.r * 0.2); blobPath(o.r * 0.6, o.j); ctx.fillStyle = G.theme.rock[1]; ctx.fill(); ctx.restore();
  ctx.strokeStyle = 'rgba(42,26,63,.4)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(o.r * 0.2, o.r * 0.1); ctx.lineTo(o.r * 0.5, o.r * 0.45); ctx.stroke();
  ctx.restore();
}
function drawTree(o) {
  const sway = Math.sin(G.time * 1.4 + o.ph) * 1.4;
  ctx.save(); ctx.translate(o.x, o.y);
  ctx.fillStyle = 'rgba(20,10,40,.2)'; ctx.beginPath(); ctx.ellipse(8, 10, o.r * 1.3, o.r * 1.1, 0, 0, TAU); ctx.fill();
  ctx.strokeStyle = INK; ctx.lineWidth = 3.5; ctx.lineJoin = 'round';
  const [c1, c2] = G.theme.tree;
  blobPath(o.r * 1.32, o.j); ctx.fillStyle = c1; ctx.fill(); ctx.stroke();
  ctx.fillStyle = c2;
  for (let i = 0; i < 5; i++) {
    const a = i * 1.2566 + o.ph, r = o.r * 0.62;
    ctx.beginPath(); ctx.arc(Math.cos(a) * r + sway, Math.sin(a) * r, o.r * 0.42, 0, TAU); ctx.fill();
  }
  ctx.fillStyle = 'rgba(255,255,255,.22)'; ctx.beginPath(); ctx.ellipse(-o.r * 0.42, -o.r * 0.5, o.r * 0.45, o.r * 0.28, -0.6, 0, TAU); ctx.fill();
  ctx.strokeStyle = 'rgba(42,26,63,.3)'; ctx.lineWidth = 2;
  for (let i = 0; i < 3; i++) { const a = i * 2.1 + o.ph + 0.5; ctx.beginPath(); ctx.arc(Math.cos(a) * o.r * 0.55, Math.sin(a) * o.r * 0.55, o.r * 0.3, a + 1, a + 2.4); ctx.stroke(); }
  if (o.fruit) { ctx.fillStyle = '#ff5a6e'; for (let i = 0; i < 4; i++) { const a = i * 1.7 + 1; ctx.beginPath(); ctx.arc(Math.cos(a) * o.r * 0.7, Math.sin(a) * o.r * 0.7, 3.6, 0, TAU); ctx.fill(); } }
  ctx.restore();
}
function drawObstacle(o) {
  switch (o.t) {
    case 'pond': drawPond(o); break; case 'thorn': drawThorn(o); break; case 'fire': drawFire(o); break;
    case 'fence': drawFence(o); break; case 'house': drawHouse(o); break; case 'rock': drawRock(o); break; case 'tree': drawTree(o); break;
  }
}

/* =====================================================================
   Snake drawing
===================================================================== */
function drawSnake() {
  const s = snake, n = s.segs.length, R = s.thick, sk = G.skin;
  if (!n) return;
  const flash = s.inv > 0 && G.state === 'playing' && Math.floor(G.time * 18) % 2 === 0;
  ctx.save();
  if (flash) ctx.globalAlpha = 0.5;
  const rs = drawSnake.rs || (drawSnake.rs = []);
  for (let i = 0; i < n; i++) {
    const t = i / (n - 1); let r = R * 0.95;
    if (t > 0.72) { const u = (t - 0.72) / 0.28; r *= 1 - 0.72 * u * u; }
    for (const b of s.bulges) { const d = Math.abs(i - b.i); if (d < 5) r *= 1 + 0.28 * (1 - d / 5); }
    rs[i] = r;
  }
  const vv = i => { const g = s.segs[i]; return g.x > view.x0 - 60 && g.x < view.x1 + 60 && g.y > view.y0 - 60 && g.y < view.y1 + 60; };
  ctx.fillStyle = sk.ink;
  for (let i = n - 1; i >= 1; i--) { if (!vv(i)) continue; const g = s.segs[i]; ctx.beginPath(); ctx.arc(g.x, g.y, rs[i] + 3.4, 0, TAU); ctx.fill(); }
  for (let i = n - 1; i >= 1; i--) {
    if (!vv(i)) continue;
    const g = s.segs[i], r = rs[i];
    ctx.fillStyle = sk.body; ctx.beginPath(); ctx.arc(g.x, g.y, r, 0, TAU); ctx.fill();
    if (i % 6 < 2) { ctx.fillStyle = sk.spot; ctx.beginPath(); ctx.arc(g.x, g.y, r * 0.6, 0, TAU); ctx.fill(); }
    else if (i % 6 === 3) { ctx.fillStyle = sk.belly; ctx.beginPath(); ctx.arc(g.x, g.y, r * 0.42, 0, TAU); ctx.fill(); }
    ctx.fillStyle = 'rgba(255,255,255,.26)'; ctx.beginPath(); ctx.arc(g.x - r * 0.28, g.y - r * 0.32, r * 0.36, 0, TAU); ctx.fill();
  }
  drawHead();
  ctx.restore();
  const hd = s.segs[0];
  if (s.pu.shield > 0) {
    ctx.save(); ctx.translate(hd.x, hd.y);
    const pulse = 1 + Math.sin(G.time * 6) * 0.05, rad = R * 2.1 * pulse;
    ctx.globalAlpha = s.pu.shield < 1.5 && Math.floor(G.time * 10) % 2 ? 0.25 : 1;
    ctx.fillStyle = 'rgba(127,231,255,.25)'; ctx.strokeStyle = '#7fe7ff'; ctx.lineWidth = 3.5;
    ctx.beginPath(); ctx.arc(0, 0, rad, 0, TAU); ctx.fill(); ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,.8)'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(0, 0, rad * 0.78, 3.6, 4.6); ctx.stroke();
    ctx.restore();

  for (const h of G.humans) { if (h.eaten) continue; mctx.fillStyle = cols[h.type]; mctx.beginPath(); mctx.arc(pad + h.x * k, pad + h.y * k, h.type === 'boss' ? 4.5 : 2.1, 0, TAU); mctx.fill(); }
  for (const p of G.powerups) { mctx.fillStyle = p.type === 'love' ? '#ff5a8a' : '#fff'; mctx.fillRect(pad + p.x * k - 1.5, pad + p.y * k - 1.5, 3, 3); }
  if (G.spirit) { mctx.fillStyle = '#ff5a8a'; mctx.strokeStyle = '#fff'; mctx.lineWidth = 1.5; mctx.beginPath(); mctx.arc(pad + G.spirit.x * k, pad + G.spirit.y * k, 3.4, 0, TAU); mctx.fill(); mctx.stroke(); }
  const hd = snake.segs[0]; if (hd) { mctx.fillStyle = '#5bd45b'; mctx.strokeStyle = '#fff'; mctx.lineWidth = 1.5; mctx.beginPath(); mctx.arc(pad + hd.x * k, pad + hd.y * k, 3.6, 0, TAU); mctx.fill(); mctx.stroke(); }
  mctx.strokeStyle = 'rgba(255,255,255,.6)'; mctx.lineWidth = 1;
  mctx.strokeRect(pad + view.x0 * k, pad + view.y0 * k, (view.x1 - view.x0) * k, (view.y1 - view.y0) * k);
}

/* =====================================================================
   HUD
===================================================================== */
const hudCache = {};
function setTxt(key, node, v) { if (hudCache[key] !== v) { hudCache[key] = v; node.textContent = v; } }
function setW(key, node, pct) { const v = Math.round(pct); if (hudCache[key] !== v) { hudCache[key] = v; node.style.width = v + '%'; } }
function updateHUD() {
  const s = snake, L = LEVELS[G.level - 1];
  setW('hp', el.hpBar, s.hp / s.maxHp * 100); setTxt('hpt', el.hpTxt, bn(Math.ceil(s.hp)));
  setW('st', el.stBar, s.stamina / s.maxSt * 100);
  if (G.endless) {
    const tt = Math.floor(G.eTime), ss = tt % 60;
    setTxt('lv', el.lvlName, '♾️ Endless Mode');
    setW('gr', el.grBar, clamp((100 - G.eBossT) / 100, 0, 1) * 100);
    setTxt('grt', el.grTxt, `${bn(Math.floor(tt / 60))}:${bn(Math.floor(ss / 10))}${bn(ss % 10)}`);
  } else {
    setTxt('lv', el.lvlName, `Level ${bn(G.level)}: ${L.name}`);
    setW('gr', el.grBar, clamp(G.levelGrowth / L.goal, 0, 1) * 100);
    setTxt('grt', el.grTxt, `${bn(Math.min(G.levelGrowth, L.goal))}/${bn(L.goal)}`);
  }
  setTxt('sc', el.score, bn(G.score));
  const showBoss = !!G.boss;
  if (hudCache.boss !== showBoss) { hudCache.boss = showBoss; el.bossPill.hidden = !showBoss; }
  if (G.boss) setW('bb', el.bossBar, G.boss.hp / G.boss.maxHp * 100);
  for (const k in chips) {
    const t = s.pu[k], on = t > 0, c = chips[k];
    if (hudCache['c' + k] !== on) { hudCache['c' + k] = on; c.root.hidden = !on; }
    if (on) setW('cb' + k, c.bar, Math.min(100, t / (POWER[k].dur * (1 + 0.3 * UP.guard)) * 100));
  }
  for (let i = 0; i < abBtn.length; i++) {
    const mx = ABIL[i].cd * (1 - 0.12 * UP.cool), pct = Math.round(G.cd[i] / mx * 100);
    if (hudCache['ab' + i] !== pct) { hudCache['ab' + i] = pct; abBtn[i].fill.style.height = pct + '%'; abBtn[i].root.classList.toggle('rdy', pct === 0); }
  }
}

/* =====================================================================
   Loop
===================================================================== */
let last = performance.now();
function update(dt) {
  G.time += dt;
  snake.tonguePh += dt * (snake.boosting ? 8 : 5);
  const live = G.state === 'playing' || G.state === 'menu';
  if (live) {
    updateSnake(dt);
    for (const h of G.humans) updateHuman(h, dt);
    G.humans = G.humans.filter(h => h.eaten < 0.2);
    updateProjectiles(dt);
    snakeCollisions(dt);
    if (G.state === 'playing') updateSpirit(dt);
    manage(dt);
    if (G.state === 'playing') {
      for (let i = 0; i < 3; i++) G.cd[i] = Math.max(0, G.cd[i] - dt);
      if (G.endless) updateEndless(dt); else checkLevel();
    }
  }
  updateFX(dt);
}
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (G.state !== 'paused') update(dt);
  render();
  if (G.state === 'playing') { updateHUD(); drawMini(); }
  requestAnimationFrame(frame);
}
function resize() {
  dpr = Math.min(2, window.devicePixelRatio || 1);
  const r = app.getBoundingClientRect();
  cw = Math.max(1, r.width); ch = Math.max(1, r.height);
  canvas.width = Math.round(cw * dpr); canvas.height = Math.round(ch * dpr);
}
addEventListener('resize', resize);
resize();
showMenu();
requestAnimationFrame(frame);
})();
</script>
</body>
